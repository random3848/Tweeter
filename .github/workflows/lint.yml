# Checks every Kotlin file (*.kt, *.kts) against the Android Kotlin style guide.
# `./gradlew ktlintCheck` runs ktlint with its standard rules plus this repo's
# own rule set (ktlint-rules/), configured in .editorconfig. The ktlint version
# is pinned in gradle/libs.versions.toml.
#
# Kept separate from build.yml so style failures show up as their own check.
#
# The job id is "ktlint" and nothing overrides it, so that is the check name
# to require in a ruleset.

name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, development ]

permissions:
  contents: read

jobs:
  ktlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run ktlint
        run: ./gradlew ktlintCheck
